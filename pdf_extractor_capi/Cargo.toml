[package]
name = "pdf_extractor_capi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pdf_extractor = { path = "../pdf_extractor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
unicode-normalization = "0.1"
