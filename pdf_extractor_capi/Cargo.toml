[package]
name = "pdf_extractor_capi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
pdf_extractor = { path = "../pdf_extractor" }
serde_json = "1"
tantivy = "0.22"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
